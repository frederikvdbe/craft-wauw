name: Deploy Staging

on:
    push:
        branches: [ staging ]
    workflow_dispatch:

concurrency:
    group: deploy-staging
    cancel-in-progress: false

jobs:

    deploy:
        runs-on: ubuntu-latest
        environment: staging

        env:
            SSH_TARGET: ${{ vars.SSH_TARGET }}
            DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
            SSH: ssh -i ./deploy_key -o UserKnownHostsFile=./known_hosts -o StrictHostKeyChecking=yes -o LogLevel=ERROR

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    tools: composer:v2

            -   name: Setup node
                uses: actions/setup-node@v4
                with:
                    node-version: '24'
                    cache: npm

            -   name: Install dependencies
                run: |
                    npm ci
                    composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            -   name: Build
                run: npm run build

            -   name: Setup SSH key
                run: |
                    echo "${{ secrets.DEPLOY_KEY }}" > deploy_key
                    chmod 600 ./deploy_key
                    echo "${{ vars.SSH_KNOWN_HOSTS }}" > known_hosts

            -   name: Sync
                run: |
                    rsync -ah \
                      -e "$SSH" \
                      --exclude /deploy_key \
                      --exclude /known_hosts \
                      --exclude /.git/ \
                      --exclude /.github/ \
                      --exclude /.ddev/ \
                      --exclude /.claude/ \
                      --exclude /.vscode/ \
                      --exclude /.env \
                      --exclude /node_modules/ \
                      --exclude /templates/ \
                      --exclude /modules/ \
                      --exclude /translations/ \
                      --exclude /config/project/ \
                      --exclude /vendor/ \
                      --exclude /web/dist/ \
                      --include '/storage/rebrand/***' \
                      --exclude '/storage/*' \
                      --exclude '/web/uploads/*' \
                      --exclude '/web/cpresources/*' \
                      --exclude /web/temp/ \
                      ./ "$SSH_TARGET:$DEPLOY_PATH"

            -   name: Sync code (remove old files)
                run: |
                    rsync -ahR --delete \
                      -e "$SSH" \
                      templates/ modules/ translations/ config/project/ vendor/ web/dist/ \
                      "$SSH_TARGET:$DEPLOY_PATH"

            -   name: Craft up
                run: |
                    $SSH "$SSH_TARGET" "cd $DEPLOY_PATH \
                      && php craft up --interactive=0 \
                      && php craft clear-caches/compiled-templates \
                      && php craft clear-caches/compiled-classes \
                      && php craft clear-caches/data"

            -   name: Remove SSH key
                if: always()
                run: rm -f ./deploy_key ./known_hosts
